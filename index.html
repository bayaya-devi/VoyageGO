<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#2F7768">
    <meta name="description" content="VoyageGo — un portail, plusieurs pays à découvrir.">
    <meta name="robots" content="noindex,follow">
    <title>VoyageGo — le monde vous attend</title>
    <base href="./">
    <link rel="icon" type="image/png" sizes="192x192" href="voyagego-icon.png">
    <script>
      (() => {
        const supported = ['fr', 'en', 'ar'];
        let locale = null;
        try {
          const saved = localStorage.getItem('voyagego-language');
          if (supported.includes(saved)) locale = saved;
        } catch { /* Continue with the browser's language when storage is unavailable. */ }
        if (!locale) {
          for (const language of navigator.languages || [navigator.language]) {
            const code = language?.toLowerCase().split('-')[0];
            if (supported.includes(code)) { locale = code; break; }
          }
        }
        locale ||= 'fr';
        location.replace(new URL(`${locale}/`, document.baseURI));
      })();
    </script>
  </head>
  <body>
    <main>
      <h1>VoyageGo</h1>
      <nav aria-label="Langue">
        <a href="fr/">Français</a> · <a href="en/">English</a> · <a href="ar/" lang="ar" dir="rtl">العربية</a>
      </nav>
    </main>
  </body>
</html>
